<script>
// 見た目の設定を、画面が出る前に当てる（暗い画面が一瞬出るのを防ぐ）。既定は明るい配色。
try { var t = (JSON.parse(localStorage.getItem('fathom.progress') || '{}').settings || {}).theme; document.documentElement.dataset.theme = t === 'dark' || t === 'auto' ? t : 'light'; }
catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
